name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Not using android-actions/setup-android: on this runner it pulls a
      # *preview* cmdline-tools that then fails its own licence check, so it
      # can never bootstrap itself. The runner image already ships an SDK.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          mkdir -p "$SDK/licenses"
          printf '%s\n' \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            84831b9409646a918e30573bab4c9c91346d8abd > "$SDK/licenses/android-sdk-license"
          printf '%s\n' \
            33b6a2b64607f11b759f320ef9dff4ae5c47d97a > "$SDK/licenses/android-sdk-preview-license"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || { echo "no sdkmanager at $SM"; ls "$SDK/cmdline-tools"; exit 1; }
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.14904198" \
            "cmake;3.22.1"

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Build debug + release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Run native pty tests (host build, no JNI)
        run: |
          cc -Wall -Wextra -O2 -std=c11 -D_GNU_SOURCE -o /tmp/test_pty \
             native/pty/test_pty.c native/pty/pty_core.c
          /tmp/test_pty "$(command -v bash)"

      - name: Verify the .so is built and 16KB-page aligned
        run: |
          set -euo pipefail
          SO=$(find app/build -name 'libtesslpty.so' -path '*arm64-v8a*' | head -1)
          echo "so=$SO"
          test -n "$SO"
          readelf -lW "$SO" | grep -E 'LOAD' | awk '{print $NF}' | sort -u
          # Every PT_LOAD p_align must be >= 0x4000 for 16KB page devices,
          # which Android 15+ devices now ship.
          readelf -lW "$SO" | awk '/LOAD/{print $NF}' | while read a; do
            printf 'align %s = %d\n' "$a" "$((a))"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 14
