name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Build debug + release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Run native pty tests (host build, no JNI)
        run: |
          cc -Wall -Wextra -O2 -std=c11 -D_GNU_SOURCE -o /tmp/test_pty \
             native/pty/test_pty.c native/pty/pty_core.c
          /tmp/test_pty "$(command -v bash)"

      - name: Verify the .so is built and 16KB-page aligned
        run: |
          set -euo pipefail
          SO=$(find app/build -name 'libtesslpty.so' -path '*arm64-v8a*' | head -1)
          echo "so=$SO"
          test -n "$SO"
          readelf -lW "$SO" | grep -E 'LOAD' | awk '{print $NF}' | sort -u
          # Every PT_LOAD p_align must be >= 0x4000 for 16KB page devices,
          # which Android 15+ devices now ship.
          readelf -lW "$SO" | awk '/LOAD/{print $NF}' | while read a; do
            printf 'align %s = %d\n' "$a" "$((a))"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 14
